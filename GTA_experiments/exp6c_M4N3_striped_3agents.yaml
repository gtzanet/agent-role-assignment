# Experiment 6c — Agent-count sweep: 3 agents on Striped Topology
# Based on M4N3_B_striped config with spectral partitioning at n_agents=3.
# Same agent count as per_node baseline — direct comparison.

name: exp6c_M4N3_striped_3agents

system:
  N: 3
  M: 4
  L: 10

nodes:
  - id: 0
    f: 1000
  - id: 1
    f: 1000
  - id: 2
    f: 1000

delta: 5

workflows:
  - id: 0
    lambda: 35.0
    services:
      - id: 0
        node: 0
        replicas_baseline: 2
        action_space: [1, 2, 3, 4]
      - id: 1
        node: 1
        replicas_baseline: 2
        action_space: [1, 2, 3, 4]
  - id: 1
    lambda: 35.0
    services:
      - id: 2
        node: 0
        replicas_baseline: 2
        action_space: [1, 2, 3, 4]
      - id: 3
        node: 1
        replicas_baseline: 2
        action_space: [1, 2, 3, 4]
  - id: 2
    lambda: 35.0
    services:
      - id: 4
        node: 1
        replicas_baseline: 2
        action_space: [1, 2, 3, 4]
      - id: 5
        node: 2
        replicas_baseline: 2
        action_space: [1, 2, 3, 4]
  - id: 3
    lambda: 35.0
    services:
      - id: 6
        node: 1
        replicas_baseline: 2
        action_space: [1, 2, 3, 4]
      - id: 7
        node: 2
        replicas_baseline: 2
        action_space: [1, 2, 3, 4]

tig:
  C_max: 100
  rho: 0.1
  kpi_weights:
    drop_rate:   0.5
    utilization: 0.5
  delta_method: "sii_marginalised"

partitioning:
  algorithm: "spectral"
  n_agents: 3
